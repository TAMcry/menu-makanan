<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Warung Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 

  <header class="header">
    <h1> Form Pendaftaran</h1>
    <p>Daftar dulu, lalu pilih menu favoritmu</p>
  </header>

  <main class="jarak">
    <div class="form-box">
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">Nama lengkap</label>
          <input type="text" id="name" name="name" placeholder="Contoh: Budi Santoso" autocomplete="name">
          <small class="error" id="err-name"></small>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="contoh@gmail.com" autocomplete="email">
          <small class="error" id="err-email"></small>
        </div>

        <div class="field">
          <label for="phone">No. HP</label>
          <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxxx" autocomplete="tel" inputmode="tel">
          <small class="error" id="err-phone"></small>
        </div>

        <button type="submit" class="button-class" id="btnDaftar">Daftar</button>
        <p class="form-status" id="formStatus" role="status"></p>
      </form>
    </div>
  </main>

  <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#ff5500" fill-opacity="1" d="M0,96L48,122.7C96,149,192,203,288,197.3C384,192,480,128,576,122.7C672,117,768,171,864,165.3C960,160,1056,96,1152,80C1248,64,1344,96,1392,112L1440,128L1440,320L0,320Z"></path>
  </svg>

  <script src="verivikasi.js"></script>
</body>
</html>
