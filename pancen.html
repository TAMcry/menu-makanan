<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - Warung Online</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="pintar.js" defer></script>
</head>
<body>
  

  <header class="header">
    <h1>Pembayaran</h1>
    <p>Cek pesananmu, lalu buat kode bayar</p>
  </header>

  <main class="pay-wrap">
    <a href="tavmpan.html" class="back-link">← Kembali ke menu</a>

    <section class="card">
      <h2>Pesanan Anda</h2>
      <table id="cartTable">
        <tr><th>Menu</th><th>Jumlah</th><th>Harga</th></tr>
      </table>
      <p class="total-line" id="total">Total: Rp0</p>
    </section>

    <section class="card">
      <h2>Kode Bayar</h2>
      <div class="field">
        <label for="payEmail">Kirim kode ke email</label>
        <input type="email" id="payEmail" placeholder="contoh@gmail.com" autocomplete="email">
        <small class="error" id="err-payEmail"></small>
      </div>

      <div class="pay-row">
        <button class="button-class" id="btnKode" onclick="checkout()">Buat Kode Bayar</button>
      </div>

      <div id="hasil" class="hidden">
        <div class="kode-box">
          <div class="label">Kode pembayaran Anda</div>
          <div class="kode" id="kodeText">-</div>
          <div class="label">Tunjukkan ke kasir</div>
        </div>
      
    </section>
  </main>

  <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#ff5500" fill-opacity="1" d="M0,96L48,122.7C96,149,192,203,288,197.3C384,192,480,128,576,122.7C672,117,768,171,864,165.3C960,160,1056,96,1152,80C1248,64,1344,96,1392,112L1440,128L1440,320L0,320Z"></path>
  </svg>
</body>
</html>
